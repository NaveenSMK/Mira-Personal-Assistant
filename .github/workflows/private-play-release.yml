name: MIRA Private Play Release Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-bundle:
    name: Validate and build signed AAB
    runs-on: ubuntu-latest
    env:
      MIRA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MIRA_UPLOAD_KEYSTORE_BASE64 }}
      MIRA_KEYSTORE_PASSWORD: ${{ secrets.MIRA_KEYSTORE_PASSWORD }}
      MIRA_KEY_ALIAS: ${{ secrets.MIRA_KEY_ALIAS }}
      MIRA_KEY_PASSWORD: ${{ secrets.MIRA_KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require release signing secrets
        shell: bash
        run: |
          for name in MIRA_UPLOAD_KEYSTORE_BASE64 MIRA_KEYSTORE_PASSWORD MIRA_KEY_ALIAS MIRA_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required GitHub Actions secret: $name"; exit 1; fi
          done
          printf '%s' "$MIRA_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mira-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/mira-upload-key.jks"
          echo "MIRA_KEYSTORE_PATH=$RUNNER_TEMP/mira-upload-key.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Ensure Gradle wrapper exists
        shell: bash
        run: |
          # Always align the checked-out wrapper with the Gradle version provisioned above.
          gradle wrapper --gradle-version 8.14.4
          chmod +x ./gradlew

      - name: Run source safety audits
        run: |
          python tools/static_audit.py
          python tools/security_audit.py

      - name: Run release lint and tests
        run: ./gradlew testDebugUnitTest lintRelease --stacktrace

      - name: Build signed Android App Bundle
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: mira-private-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
